<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>挪车联系卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 50px 35px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .icon {
            font-size: 64px;
            margin-bottom: 10px;
            display: block;
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 14px;
            color: #999;
            margin: 6px 0 25px;
            letter-spacing: 4px;
        }
        .divider {
            width: 40px;
            height: 3px;
            background: #4a90d9;
            margin: 0 auto 25px;
            border-radius: 4px;
        }
        .phone-number {
            font-size: 30px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: 3px;
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 12px 0;
            border-radius: 12px;
            font-family: "SF Pro Display", -apple-system, sans-serif;
        }
        .call-btn {
            display: inline-block;
            background: linear-gradient(135deg, #4a90d9 0%, #357abd 100%);
            color: white;
            font-size: 20px;
            font-weight: 600;
            padding: 16px 0;
            border-radius: 50px;
            text-decoration: none;
            width: 100%;
            box-shadow: 0 8px 20px rgba(74, 144, 217, 0.4);
            letter-spacing: 2px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .call-btn:active {
            transform: scale(0.96);
            box-shadow: 0 4px 12px rgba(74, 144, 217, 0.3);
        }
        .hint {
            font-size: 12px;
            color: #bbb;
            margin-top: 18px;
            letter-spacing: 1px;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #ddd;
            letter-spacing: 1px;
        }
        .source-tag {
            margin-top: 15px;
            font-size: 11px;
            color: #ccc;
            background: #f5f5f5;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="card" id="app">
    <span class="icon">🚗</span>
    <div class="title">临时停放 · 挪车联系</div>
    <div class="subtitle">— 敬请谅解 —</div>
    <div class="divider"></div>
    <div class="phone-number" id="phoneDisplay">135 **** 5779</div>
    <a href="tel:13541005779" class="call-btn" id="callBtn">📞 立即拨打</a>
    <div class="hint">点击按钮即可直接呼叫车主</div>
    <div class="footer">感谢您的理解与配合 🙏</div>
    <div class="source-tag" id="sourceTag">📱 系统相机扫码</div>
</div>

<script>
(function() {
    // ============ 配置区 ============
    const PHONE = '13541005779';           // 手机号（纯数字）
    const PHONE_DISPLAY = '135 **** 5779'; // 显示格式（可带空格/星号）
    // ================================

    // 获取 URL 参数
    function getQueryParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }

    // 检测是否在微信内置浏览器中
    function isWechat() {
        return /MicroMessenger/i.test(navigator.userAgent);
    }

    // 检测是否在手机端
    function isMobile() {
        return /Android|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent);
    }

    // 获取来源
    function getSource() {
        // 1. 优先看 URL 参数 ?from=xxx
        const fromParam = getQueryParam('from');
        if (fromParam === 'system') return 'system';
        if (fromParam === 'wechat') return 'wechat';

        // 2. 检测微信环境
        if (isWechat()) return 'wechat';

        // 3. 默认：非微信手机端 → 系统相机
        if (isMobile()) return 'system';

        // 4. PC 端访问 → 显示页面
        return 'pc';
    }

    // 执行跳转或显示
    function handleRedirect() {
        const source = getSource();
        const sourceTag = document.getElementById('sourceTag');

        // 更新来源标签（调试用，可删除）
        if (sourceTag) {
            const labels = {
                'system': '📱 系统相机扫码',
                'wechat': '💬 微信扫一扫',
                'pc': '💻 PC 端访问'
            };
            sourceTag.textContent = labels[source] || '📱 扫码访问';
        }

        // ===== 核心逻辑 =====
        if (source === 'system') {
            // 系统相机扫码 → 直接拨号
            window.location.href = 'tel:' + PHONE;
            return;
        }

        if (source === 'wechat') {
            // 微信扫一扫 → 展示页面，用户点击按钮拨号
            // 不做任何跳转，展示页面即可
            return;
        }

        // PC 端或其他 → 展示页面
        // 不做任何跳转
    }

    // 页面加载后执行
    handleRedirect();

    // 额外：如果页面从后台切回，重新检测（防止微信二次跳转问题）
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            // 如果当前是微信环境，且 URL 没有 from 参数，但页面已经显示了，不需要重复跳转
        }
    });

})();
</script>

</body>
</html>
