<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>挪车联系卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 50px 35px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .icon {
            font-size: 64px;
            margin-bottom: 10px;
            display: block;
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 14px;
            color: #999;
            margin: 6px 0 25px;
            letter-spacing: 4px;
        }
        .divider {
            width: 40px;
            height: 3px;
            background: #4a90d9;
            margin: 0 auto 25px;
            border-radius: 4px;
        }
        .phone-number {
            font-size: 30px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: 3px;
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 12px 0;
            border-radius: 12px;
            font-family: "SF Pro Display", -apple-system, sans-serif;
        }
        .call-btn {
            display: inline-block;
            background: linear-gradient(135deg, #4a90d9 0%, #357abd 100%);
            color: white;
            font-size: 20px;
            font-weight: 600;
            padding: 16px 0;
            border-radius: 50px;
            text-decoration: none;
            width: 100%;
            box-shadow: 0 8px 20px rgba(74, 144, 217, 0.4);
            letter-spacing: 2px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .call-btn:active {
            transform: scale(0.96);
            box-shadow: 0 4px 12px rgba(74, 144, 217, 0.3);
        }
        .hint {
            font-size: 12px;
            color: #bbb;
            margin-top: 18px;
            letter-spacing: 1px;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #ddd;
            letter-spacing: 1px;
        }
        .loading {
            font-size: 16px;
            color: #666;
            text-align: center;
            padding: 40px;
        }
        .source-tag {
            margin-top: 15px;
            font-size: 11px;
            color: #ccc;
            background: #f5f5f5;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        .auto-redirect-tip {
            margin-top: 10px;
            font-size: 12px;
            color: #4a90d9;
            background: #e8f0fe;
            padding: 8px 16px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 加载提示（JS未执行完时显示） -->
    <div class="loading" id="loadingTip">⏳ 正在跳转...</div>

    <!-- 卡片内容（默认隐藏，JS执行完才显示） -->
    <div class="card" id="card" style="display:none;">
        <span class="icon">🚗</span>
        <div class="title">临时停放 · 挪车联系</div>
        <div class="subtitle">— 敬请谅解 —</div>
        <div class="divider"></div>
        <div class="phone-number" id="phoneDisplay">135 **** 5779</div>
        <a href="tel:13541005779" class="call-btn" id="callBtn">📞 立即拨打</a>
        <div class="hint">点击按钮即可直接呼叫车主</div>
        <div class="footer">感谢您的理解与配合 🙏</div>
        <div class="source-tag" id="sourceTag">📱 扫码访问</div>
        <div class="auto-redirect-tip" id="autoTip">✅ 检测到系统相机扫码，即将自动拨号...</div>
    </div>
</div>

<script>
(function() {
    // ============ 配置区 ============
    const PHONE = '13541005779';           // 手机号（纯数字）
    const PHONE_DISPLAY = '135 **** 5779'; // 显示格式
    // ================================

    // 检测是否在微信内置浏览器中
    function isWechat() {
        return /MicroMessenger/i.test(navigator.userAgent);
    }

    // 检测是否在手机端
    function isMobile() {
        return /Android|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent);
    }

    // 检测是否在支付宝内置浏览器
    function isAlipay() {
        return /AlipayClient/i.test(navigator.userAgent);
    }

    // 检测是否在 QQ 内置浏览器
    function isQQ() {
        return /QQ/i.test(navigator.userAgent) && /MQQBrowser/i.test(navigator.userAgent);
    }

    // 判断是否应该自动跳转拨号（非微信、非支付宝、非QQ等内置浏览器）
    function shouldAutoDial() {
        // 如果在微信/支付宝/QQ内置浏览器中 → 不自动跳转，显示页面让用户点击
        if (isWechat() || isAlipay() || isQQ()) {
            return false;
        }
        // 如果是手机端 → 自动跳转
        if (isMobile()) {
            return true;
        }
        // PC 端 → 不自动跳转，显示页面预览
        return false;
    }

    // 执行跳转拨号
    function dialPhone() {
        window.location.href = 'tel:' + PHONE;
    }

    // 显示卡片
    function showCard(source) {
        document.getElementById('loadingTip').style.display = 'none';
        const card = document.getElementById('card');
        card.style.display = 'block';

        // 更新来源标签
        const sourceTag = document.getElementById('sourceTag');
        const labels = {
            'wechat': '💬 微信扫一扫',
            'alipay': '💰 支付宝扫一扫',
            'qq': '🐧 QQ扫一扫',
            'system': '📱 系统相机扫码',
            'pc': '💻 PC 端访问'
        };
        sourceTag.textContent = labels[source] || '📱 扫码访问';

        // 如果是系统相机扫码，显示自动跳转提示
        if (source === 'system') {
            document.getElementById('autoTip').style.display = 'block';
        }
    }

    // 主逻辑
    function main() {
        // 判断来源
        let source = 'system';
        if (isWechat()) source = 'wechat';
        else if (isAlipay()) source = 'alipay';
        else if (isQQ()) source = 'qq';
        else if (!isMobile()) source = 'pc';

        // 判断是否自动跳转
        if (shouldAutoDial()) {
            // 系统相机扫码 → 显示卡片后自动跳转（用户能看到提示）
            showCard(source);
            // 延迟 800ms 后跳转，让用户看到提示
            setTimeout(function() {
                dialPhone();
            }, 800);
        } else {
            // 微信/支付宝/QQ/PC → 显示卡片，让用户点击按钮
            showCard(source);
        }
    }

    // 页面加载完成后执行
    if (document.readyState === 'complete') {
        main();
    } else {
        window.addEventListener('load', main);
    }

})();
</script>

</body>
</html>
